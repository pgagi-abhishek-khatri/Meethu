name: OKF Bundle Validation

on:
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - "OKF/**"
      - "scripts/validate-okf.js"
      - "test/okf/**"
      - ".github/workflows/okf-validation.yml"
  pull_request:
    paths:
      - "OKF/**"
      - "scripts/validate-okf.js"
      - "test/okf/**"
      - ".github/workflows/okf-validation.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-okf:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate OKF Bundle Registry & Metadata
        run: npm run validate:okf
      - name: Run OKF Unit Tests
        run: node --import tsx --test "test/okf/**/*.test.js"
